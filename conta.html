<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
    var n1
    var n2
$(document).ready(function(){
  $("#collect").click(function(){
    n1 = parseInt($("#n1").val());
    n2 = parseInt($("#n2").val());
  });
  $("#soma").click(function(){
    soma = (n1 + n2)
    $("div").html(n1 + " + " + n2 + " = " + soma)
  });
  $("#sub").click(function(){
    sub = (n1 - n2)
    $("div").html(n1 + " - " + n2 + " = " + sub)
  });
  $("#mult").click(function(){
    mult = (n1 * n2)
    $("div").html(n1 + " * " + n2 + " = " + mult)
  });
  $("#divi").click(function(){
    divi = (n1 / n2)
    $("div").html(n1 + " / " + n2 + " = " + divi)
  });
});
</script>
</head>
<body>
    <input type="number" id="n1" placeholder="primeiro numero">
    <input type="number" id="n2" placeholder="segundo numero">
    <button id="collect">Coletar numeros</button><br>
    <button id="soma">+</button>
    <button id="sub">-</button>
    <button id="mult">*</button>
    <button id="divi">/</button>
    <div></div>
</body>
</html>
