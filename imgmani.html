<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
    var speed = 400
    var vel = 5
$(document).ready(function(){
  $("#bh").click(function(){
    $("img").hide(speed)
  });
  $("#bs").click(function(){
    $("img").show(speed)
  });
  $("#bt").click(function(){
    $("img").toggle(speed)
  });
  $("#bfi").click(function(){
    $("img").fadeIn(speed)
  });
  $("#bfo").click(function(){
    $("img").fadeOut(speed)
  });
  $("#bft").click(function(){
    $("img").fadeToggle(speed)
  });
  $("#bsu").click(function(){
    $("img").slideUp(speed)
  });
  $("#bsd").click(function(){
    $("img").slideDown(speed)
  });
  $("#bst").click(function(){
    $("img").slideToggle(speed)
  });
  $("#slow").click(function(){
    if (vel > 0){
    speed += 200
    vel -= 1
    $("text").html(vel)
    }
  })
  $("#fast").click(function(){
    if (speed > 0){
    speed -= 200
    vel += 1
    $("text").html(vel)
    }
  })
});
</script>
<style>
    #containment {
        height: 450px;
    }
</style>
</head>
<body>
    <div id="containment" align="center"><img src="peekaboo.png" id="bear"></img></div>
    <div align="center">
    <button id="bh">Hide</button>
    <button id="bs">Show</button>
    <button id="bt">Toggle</button>
    <button id="bfi">Fade In</button>
    <button id="bfo">Fade Out</button>
    <button id="bft">Fade Toggle</button>
    <button id="bsu">Slide Up</button>
    <button id="bsd">Slide Down</button>
    <button id="bst">Slide Toggle</button><br><br>
    <button id="slow">-</button>
    <text>5</text>
    <button id="fast">+</button>
    </div>
</body>
</html>
