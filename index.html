<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
    var n1;
    var n2;
$(document).ready(function(){
    $("#soma").click(function(){
        n1 = parseInt($("#n1").val());
        n2 = parseInt($("#n2").val());
            $.ajax({
                    url: "soma.php",
                    type: "POST",
                    data: "n1=" + n1 + "&n2=" + n2,
                    dataType: "html"
                    
                }).done(function(resposta) {
                    $("div").html(resposta);

                }).fail(function(jqXHR, textStatus ) {
                    alert("Request failed: " + textStatus);

                }).always(function() {
                    console.log("completou");
                });
        });
        $("#sub").click(function(){
            n1 = parseInt($("#n1").val());
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "sub.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("div").html(resposta);

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
        $("#mult").click(function(){
            n1 = parseInt($("#n1").val());
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "mult.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("div").html(resposta);

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
        $("#divi").click(function(){
            n1 = parseInt($("#n1").val());
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "divi.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("div").html(resposta);

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
});
</script>
</head>
<body>
    <input type="number" id="n1" placeholder="primeiro numero">
    <input type="number" id="n2" placeholder="segundo numero"><br>
    <button id="soma" value="1">+</button>
    <button id="sub" value="2">-</button>
    <button id="mult" value="3">*</button>
    <button id="divi" value="4">/</button>
    <div></div>
</body>
</html>
