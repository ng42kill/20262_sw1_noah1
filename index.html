<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
    var n1 = 0;
    var n2;
$(document).ready(function(){
    $("#soma").click(function(){
        n2 = parseInt($("#n2").val());
            $.ajax({
                    url: "operations/soma.php",
                    type: "POST",
                    data: "n1=" + n1 + "&n2=" + n2,
                    dataType: "html"
                    
                }).done(function(resposta) {
                    $("#resultado").html(resposta);
                    $("#hist").append(n1 + " + " + n2 + " = " + resposta + "<br>");
                    n1 = resposta

                }).fail(function(jqXHR, textStatus ) {
                    alert("Request failed: " + textStatus);

                }).always(function() {
                    console.log("completou");
                });
        });
        $("#sub").click(function(){
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "sub.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("#resultado").html(resposta);
                    $("#hist").append(n1 + " - " + n2 + " = " + resposta + "<br>");
                    n1 = resposta

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
        $("#mult").click(function(){
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "mult.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("#resultado").html(resposta);
                    $("#hist").append(n1 + " * " + n2 + " = " + resposta + "<br>");
                    n1 = resposta

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
        $("#divi").click(function(){
            n2 = parseInt($("#n2").val());
            $.ajax({
                url: "divi.php",
                type: "POST",
                data: "n1=" + n1 + "&n2=" + n2,
                dataType: "html"
                
            }).done(function(resposta) {
                    $("#resultado").html(resposta);
                    $("#hist").append(n1 + " / " + n2 + " = " + resposta + "<br>");
                    n1 = resposta

            }).fail(function(jqXHR, textStatus ) {
                alert("Request failed: " + textStatus);

            }).always(function() {
                console.log("completou");
            });
        });
});
</script>
</head>
<body>
    <input type="number" id="n2" placeholder="numero"><br>
    <button id="soma">+</button>
    <button id="sub">-</button>
    <button id="mult">*</button>
    <button id="divi">/</button>
    <div id="resultado"></div>
    <hr>
    <div id="hist"></div>
</body>
</html>
