<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
    var speed = 400
    var vel = 5
    const numimg = [
      "zero.png",
      "one.png",
      "two.png",
      "three.png",
      "four.png",
      "five.png",
      "six.png",
      "seven.png",
    ]
$(document).ready(function(){
  $("#bh").click(function(){
    $("#bear").hide(speed)
  });
  $("#bs").click(function(){
    $("#bear").show(speed)
  });
  $("#bt").click(function(){
    $("#bear").toggle(speed)
  });
  $("#bfi").click(function(){
    $("#bear").fadeIn(speed)
  });
  $("#bfo").click(function(){
    $("#bear").fadeOut(speed)
  });
  $("#bft").click(function(){
    $("#bear").fadeToggle(speed)
  });
  $("#bsu").click(function(){
    $("#bear").slideUp(speed)
  });
  $("#bsd").click(function(){
    $("#bear").slideDown(speed)
  });
  $("#bst").click(function(){
    $("#bear").slideToggle(speed)
  });
  $("#slow").click(function(){
    if (vel > 0){
    speed += 200
    vel -= 1
    $("#numvel").attr("src", numimg[vel])
    $("#numvel").animate({
      height: "70px", width: "60px", left: "-=20px"
    }, "fast")
    $("#numvel").animate({
      height: "50px", width: "40px", left: "+=20px"
    }, "fast")
    }
  })
  $("#fast").click(function(){
    if (speed > 0){
    speed -= 200
    vel += 1
    $("#numvel").attr("src", numimg[vel])
    $("#numvel").animate({
      height: "70px", width: "60px", left: "-=20px"
    }, "fast")
    $("#numvel").animate({
      height: "50px", width: "40px", left: "+=20px"
    }, "fast")
    }
  })
});
</script>
<style>
    #containment {
        height: 450px;
    }
    #slow:hover, #fast:hover, button:hover {
      cursor: pointer;
    }
</style>
</head>
<body>
    <div id="containment" align="center"><img src="peekaboo.png" id="bear"></img></div>
    <div align="center">
    <button id="bh">Hide</button>
    <button id="bs">Show</button>
    <button id="bt">Toggle</button>
    <button id="bfi">Fade In</button>
    <button id="bfo">Fade Out</button>
    <button id="bft">Fade Toggle</button>
    <button id="bsu">Slide Up</button>
    <button id="bsd">Slide Down</button>
    <button id="bst">Slide Toggle</button><br><br>
    <img src="slow.png" id="slow" height="28px" width="25px">
    <img src="five.png" id="numvel" height="50px" width="40px">
    <img src="accel.png" id="fast" height="30px" width="25px">
    </div>
</body>
</html>
