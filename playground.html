<!DOCTYPE html>
<html>
<head>
<script src="jquery-4.0.0.min.js"></script>
<script>
$(document).ready(function(){
  $("#ba").click(function(){
    $("div").html("Batton foi apertado")
  });
  $("#be").click(function(){
    $("div").html("Betton foi apertado")
  });
  $("#bi").click(function(){
    $("div").html("Bitton foi apertado")
  });
  $("#bo").click(function(){
    $("div").html("Botton foi apertado")
  });
  $("#bu").click(function(){
    $("div").html("Button foi apertado")
  });
  $("button").click(function(){
    alert("Um botão foi apertado")
  });
});
</script>
</head>
<body>
    <button id="ba">Batton</button>
    <button id="be">Betton</button>
    <button id="bi">Bitton</button>

    <div></div>
</body>
</html>
